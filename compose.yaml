services:
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      - api
    volumes:
      - ./client/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
